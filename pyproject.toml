[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folder-brain"
version = "0.2.0"
description = "A memory folder your AI assistants actually read — MCP server for the Folder Brain template"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Satoshixdreams" }]
keywords = ["mcp", "memory", "ai-agents", "markdown", "claude", "codex"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Satoshixdreams/folder-brain"
Repository = "https://github.com/Satoshixdreams/folder-brain"
Issues = "https://github.com/Satoshixdreams/folder-brain/issues"

[project.scripts]
folder-brain-mcp = "brain_mcp:main"

[tool.setuptools]
package-dir = { "" = "mcp" }
py-modules = ["brain_mcp", "guard"]
